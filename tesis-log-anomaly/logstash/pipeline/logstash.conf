input {
  beats {
    port => 5044
  }
}

filter {

  # ── App logs (JSON generados por log_generator.py) ────────────────────────
  if [source_type] == "app" {
    json {
      source  => "message"
      target  => "app"
    }
    mutate {
      rename => {
        "[app][ip]"               => "ip_address"
        "[app][method]"           => "request_method"
        "[app][endpoint]"         => "endpoint"
        "[app][status_code]"      => "status_code"
        "[app][response_time_ms]" => "response_time_ms"
        "[app][bytes_sent]"       => "bytes_sent"
        "[app][severity]"         => "severity"
        "[app][label]"            => "label"
        "[app][scenario]"         => "scenario"
        "[app][service]"          => "service"
        "[app][host]"             => "source_host"
        "[app][error_msg]"        => "error_msg"
        "[app][failed_reason]"    => "failed_reason"
        "[app][event_type]"       => "event_type"
        "[app][timestamp]"        => "event_timestamp"
      }
    }
    mutate {
      convert => {
        "status_code"      => "integer"
        "response_time_ms" => "integer"
        "bytes_sent"       => "integer"
      }
    }
  }

  # ── Nginx access logs (formato combined) ──────────────────────────────────
  if [source_type] == "nginx" and [log_type] == "access" {
    grok {
      match => {
        "message" => '%{IPORHOST:ip_address} - %{DATA:http_user} \[%{HTTPDATE:raw_timestamp}\] "%{WORD:request_method} %{DATA:endpoint} HTTP/%{NUMBER}" %{NUMBER:status_code:int} %{NUMBER:bytes_sent:int} "%{DATA}" "%{DATA:user_agent}"'
      }
      tag_on_failure => ["_grok_failure"]
    }
    mutate {
      add_field => { "service" => "nginx" }
    }
    if [raw_timestamp] {
      date {
        match  => ["raw_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
      }
    }
  }

  # ── Nginx error logs ───────────────────────────────────────────────────────
  if [source_type] == "nginx" and [log_type] == "error" {
    mutate {
      add_field => {
        "service"  => "nginx"
        "severity" => "error"
      }
    }
  }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
}
